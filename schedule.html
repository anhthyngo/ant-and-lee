<!doctype html>
<html lang="en" class="is-locked">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f2d1cd" />
    <meta name="description" content="Anhthy and Lee's wedding weekend schedule." />
    <meta name="robots" content="noindex, nofollow" />
    <title>Anhthy &amp; Lee — Weekend Schedule</title>
    <link rel="icon" type="image/png" href="assets/luna.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Allura&amp;family=Be+Vietnam+Pro:ital,wght@0,500;0,600;0,700;0,800;1,700&amp;family=Noto+Sans+SC:wght@500;700;800&amp;display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css?v=20260816-40" />
    <script src="site-content.js?v=20260816-12" defer></script>
    <script src="script.js?v=20260816-11" defer></script>
  </head>
  <body data-page="schedule">
    <div class="password-gate" id="password-gate" role="dialog" aria-modal="true" aria-labelledby="password-title">
      <form class="password-card" id="password-form" novalidate>
        <img class="password-card__luna" src="assets/luna.png" alt="Luna" />
        <p class="password-card__eyebrow">Anhthy &amp; Lee</p>
        <h1 id="password-title">Bork! Bork!</h1>
        <p class="password-card__hint" id="password-hint">I'm the guard of this website! Please enter the password to get through.</p>

        <label class="visually-hidden" for="guest-password">Guest password</label>
        <div class="password-control">
          <input
            id="guest-password"
            name="password"
            type="password"
            autocomplete="current-password"
            autocapitalize="none"
            spellcheck="false"
            aria-describedby="password-hint password-error"
            placeholder="Password"
            required
          />
          <button type="submit">Enter</button>
        </div>
        <p class="password-error" id="password-error" aria-live="polite"></p>
      </form>
    </div>

    <main class="schedule-page" id="main-content" aria-hidden="true" inert>
      <a class="schedule-back" href="index.html" aria-label="Back to the wedding invitation">← Invitation</a>
      <section class="weekend-plan" aria-labelledby="schedule-title">
        <header class="schedule-heading">
          <p>Save the weekend</p>
          <h2 id="schedule-title">
            <span class="visually-hidden">Weekend Events</span>
            <img class="schedule-heading-art" src="assets/font-headings/weekend-events.png" alt="" aria-hidden="true" />
          </h2>
        </header>
        <ol class="schedule-list" id="schedule-list" aria-label="Wedding weekend schedule"></ol>
      </section>
    </main>
  </body>
</html>
